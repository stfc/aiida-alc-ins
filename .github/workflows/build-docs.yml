# Build the Sphinx docs (autoapi + gallery). The gallery executes real AiiDA
# workflows, so the runner needs Graphviz (provenance graphs) and procps (`ps`,
# used by AiiDA's direct scheduler). Deploys to GitHub Pages on manual dispatch.
name: Build docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest  # x86-64: euphonic resolves from PyPI
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz procps

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build documentation
        run: uv run --group doc make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
