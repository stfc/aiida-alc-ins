# Build the Sphinx docs (autoapi + gallery). The gallery executes real AiiDA
# workflows, so the runner needs Graphviz (provenance graphs) and procps (`ps`,
# used by AiiDA's direct scheduler). Every run uploads the built HTML as a
# `docs-html` artifact for preview (also when a warning fails the build). Only a
# manual dispatch from the default branch deploys to GitHub Pages, so a branch
# can be dispatched for a preview without publishing it.
name: Build docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest  # x86-64: euphonic resolves from PyPI
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz procps

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"

      - name: Build documentation
        run: uv run --group doc make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Upload HTML preview
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
