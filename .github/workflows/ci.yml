# Minimal CI: install with uv and run the test suite.
# Runs on x86-64 Linux, where Euphonic is resolved from PyPI (the aarch64 wheel
# workaround in pyproject.toml is skipped by its platform marker).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run linter
        run: uv run ruff check

      - name: Check code formatting
        run: uv run ruff format --check

  test:
    needs: lint
    runs-on: ubuntu-latest  # x86-64; provides `ps` (procps) for AiiDA's scheduler
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache test container
        id: build-container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/container/Dockerfile
          tags: aiida-ssh-hq-test:latest
          load: true
          cache-from: type=gha,scope=container-test
          cache-to: ${{ matrix.python-version == '3.12' && 'type=gha,mode=max,scope=container-test' || '' }}

      - name: Run tests
        env:
          CONTAINER_ENGINE: docker
          CONTAINER_IMAGE: ${{ steps.build-container.outputs.imageid }}
        run: uv run pytest -v --durations=10
