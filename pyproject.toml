# Packaging + tooling configuration for the aiida-pythonjob-ins proof-of-concept.
# See openspec/specs/ for the behaviour this package guarantees, and
# docs/source/design_notes.rst for the design rationale.
# Use uv's native build backend for consistency with the uv-based workflow
# (https://docs.astral.sh/uv/concepts/build-backend/). setuptools would be the
# conservative "established standard" alternative.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "aiida-pythonjob-ins"
version = "0.1.0"
description = "Proof-of-concept AiiDA plugin wrapping INS Python libraries (Euphonic first) via aiida-pythonjob."
readme = "README.md"
# Relaxed to >=3.11 for Python version compatibility (local aarch64 wheel needs cp312)
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Bounds reflect *our own* API usage, not sibling dependencies' constraints (the
# resolver intersects everyone's requirements). Upper caps are used only where
# individually justified, to avoid needless conflicts with co-installed plugins.
dependencies = [
    # aiida-core: we use aiida.orm/engine plus the SQLite test backend and
    # `aiida.tools.pytest_fixtures` (both added in 2.6). Cap at the next major, as
    # an aiida-core 3.0 would likely break plugin APIs. (aiida-pythonjob
    # independently requires >=2.7.1, which the resolver enforces on top.)
    "aiida-core>=2.6,<3",
    # aiida-pythonjob: run plain Python functions as AiiDA jobs (Python-API model).
    # https://github.com/aiidateam/aiida-pythonjob
    # Pre-1.0 and classified "Development Status :: 3 - Alpha" with no documented
    # SemVer/stability policy; minor (0.x) releases have evolved the API, so pin to
    # the tested 0.5.x series.
    "aiida-pythonjob~=0.5.2",
    # Euphonic: phonon/lattice-dynamics from force constants (SemVer-compliant).
    # https://euphonic.readthedocs.io
    # The `phonopy-reader` extra (h5py + PyYAML) is default-on so phonopy input
    # works out of the box, and its spec stays consistent with the euphonic
    # version in use. Pinned to 2.x. On aarch64-Linux, local wheels in wheels/
    # are found via tool.uv.find-links.
    "euphonic[phonopy-reader]~=2.0",
    # seekpath: we call `get_explicit_k_path_orig_cell` (the *_orig_cell path is
    # almost always preferable to the older get_*_path). 2.2.1 also carries
    # significant bugfixes and compatibility fixes. This matches Euphonic's own
    # pin (see https://github.com/pace-neutrons/Euphonic/pull/457), but for our
    # own reasons, not merely to track it. https://seekpath.readthedocs.io
    "seekpath>=2.2.1,<3",
    # abinslib: almost-isotropic incoherent INS intensities (fundamentals +
    # Mantid/AbINS-style combination modes) from Euphonic QpointPhononModes.
    # https://github.com/isisneutronmuon/abINS_lib -- alpha ("Development Status
    # :: 3 - Alpha") with the 0.2 release decoupling cross-section weighting into
    # an explicit `apply_weights` function. Pinned to the tested 0.2.x series.
    "abinslib~=0.2.0",
    # resins: instrument resolution functions (e.g. TOSCA's energy-dependent
    # broadening). https://github.com/pace-neutrons/resins -- pre-1.0; its own
    # README advises pinning to a specific minor version. abinslib 0.2 requires
    # resins~=0.1, so the resolver enforces compatibility regardless of what we
    # declare here.
    "resins~=0.1.0",
]

[dependency-groups]
# Dev/test tooling (PEP 735 group; installed by `uv sync`).
dev = [
    "aiida-hyperqueue>=0.4",
    "filelock>=3.12",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3",
    "ruff>=0.10",
]

# Documentation stack (Sphinx + autoapi + gallery + furo), modelled on abinslib.
# Build with: `uv run --group doc make -C docs html` (needs system Graphviz + procps).
doc = [
    "sphinx>=8,<10",
    "furo",
    "sphinx-autoapi>=3.5",
    "sphinx-gallery>=0.19",
    "myst-parser>=4",
    "matplotlib",
    "graphviz",  # renders AiiDA provenance graphs (needs the system `dot`)
]

# --- AiiDA plugin entry points -------------------------------------------------
# AiiDA discovers plugins via entry points; see
# https://aiida.readthedocs.io/projects/aiida-core/en/stable/topics/plugins.html
[project.entry-points."aiida.data"]
"pythonjob_ins.crystal" = "aiida_pythonjob_ins.data.crystal:EuphonicCrystalData"
"pythonjob_ins.force_constants" = "aiida_pythonjob_ins.data.force_constants:ForceConstantsData"
"pythonjob_ins.qpoint_phonon_modes" = "aiida_pythonjob_ins.data.qpoint_phonon_modes:QpointPhononModesData"

[project.entry-points."aiida.workflows"]
"pythonjob_ins.dispersion" = "aiida_pythonjob_ins.workflows.dispersion:DispersionWorkChain"
"pythonjob_ins.dos" = "aiida_pythonjob_ins.workflows.dos:DosWorkChain"
"pythonjob_ins.tosca_from_modes" = "aiida_pythonjob_ins.workflows.tosca:ToscaFromModesWorkChain"
"pythonjob_ins.tosca_from_force_constants" = "aiida_pythonjob_ins.workflows.tosca:ToscaFromForceConstantsWorkChain"

# --- Euphonic wheel workaround (aarch64-Linux only) ----------------------------
# On aarch64-Linux, PyPI has no 2.x wheel yet. `find-links = ["wheels"]` allows uv
# to find local wheels placed in `wheels/` on aarch64, while on x86_64 CI (where
# wheels/ is empty or missing), uv installs euphonic directly from PyPI.
[tool.uv]
find-links = ["wheels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "containerized: integration tests requiring a local or CI container runtime (podman/docker)",
    "venv_code: tests that build and run against a separate interpreter environment (AiiDA-free venv)",
]
filterwarnings = [
    "ignore:Creating AiiDA configuration folder:UserWarning",
    "ignore:invalid escape sequence:SyntaxWarning",
    "ignore:There is no current event loop:DeprecationWarning:plumpy",
    "ignore:Object of type .* not in session:sqlalchemy.exc.SAWarning",
    "ignore:Set OLD_ERROR_HANDLING to false:DeprecationWarning:spglib",
    "ignore:.*setting hyperqueue resources are deprecated.*:aiida_hyperqueue.scheduler.AiiDAHypereQueueDeprecationWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# A broad, exemplar-quality rule set modelled on Euphonic's selection
# (https://github.com/pace-neutrons/Euphonic pyproject.toml), trimmed to the
# stable rules that suit this smaller codebase.
select = [
    "A",      # flake8-builtins
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity (default threshold = 10)
    "COM",    # flake8-commas
    "E", "W", # pycodestyle
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FLY",    # flynt
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "PLC", "PLE", "PLW",  # pylint (skip the noisier PLR refactors)
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "YTT",    # flake8-2020
]
ignore = [
    "COM812",  # trailing comma; conflicts with the formatter
    "ISC001",  # single-line implicit string concat; conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",     # pytest fixtures are passed as args but not always referenced
    "INP001",  # tests/ is intentionally not an importable package
    "S101",    # "assert" is a core part of pytest workflow
    "S108",    # hardcoded /tmp path in test container configuration
    "S603",    # subprocess calls in container helper module
]
# Sphinx config: not a package; profile bootstrap runs before imports; event
# handlers have fixed signatures with unused args.
"docs/source/conf.py" = ["INP001", "E402", "ARG001"]
"docs/source/tutorials/*" = [
    "INP001",  # gallery scripts are not an importable package
    "E402",    # sphinx-gallery examples interleave prose cells and imports
    "T201",    # `print` is useful narration in a tutorial
    "S101",    # an example demonstrating result reuse must *assert* it happened,
               # so a silent loss of cacheability fails the docs build
]

